spring:
  application:
    name: academix
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/academix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  seed:
    admin:
      full-name: ${ADMIN_FULL_NAME:Academix Admin}
      email: ${ADMIN_EMAIL:admin@academix.com}
      password: ${ADMIN_PASSWORD:admin12345}
  uploads:
    directory: ${UPLOADS_DIR:../front/public/profile_picture}
